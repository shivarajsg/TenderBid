<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Background Technical Grid -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#262626" stroke-width="0.7" opacity="0.3"/>
      <circle cx="25" cy="25" r="0.8" fill="#404040" opacity="0.4"/>
    </pattern>
    <pattern id="fineGrid" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#1f1f1f" stroke-width="0.3" opacity="0.25"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#222225"/>
      <stop offset="60%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueprintCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Dark Engineering Backdrop -->
  <rect width="600" height="450" fill="url(#vignette)"/>
  <rect width="600" height="450" fill="url(#fineGrid)"/>
  <rect width="600" height="450" fill="url(#grid)"/>

  <!-- Blueprint Dimension Lines & Corner Accents -->
  <g stroke="#64748b" stroke-width="1" opacity="0.4">
    <!-- Top-Left Target -->
    <path d="M 20 40 L 20 20 L 40 20"/>
    <circle cx="20" cy="20" r="3" fill="none"/>
    <!-- Top-Right Target -->
    <path d="M 560 20 L 580 20 L 580 40"/>
    <circle cx="580" cy="20" r="3" fill="none"/>
    <!-- Bottom-Left Target -->
    <path d="M 20 410 L 20 430 L 40 430"/>
    <!-- Bottom-Right Target -->
    <path d="M 560 430 L 580 430 L 580 410"/>
    <!-- Center Axes -->
    <line x1="30" y1="225" x2="570" y2="225" stroke-dasharray="4,8" stroke-width="0.8" opacity="0.25"/>
    <line x1="300" y1="30" x2="300" y2="420" stroke-dasharray="4,8" stroke-width="0.8" opacity="0.25"/>
  </g>

  <!-- Technical Schematic Illustration -->
  <g transform="translate(0, -10)">
    
<g transform="translate(300, 200)">
  <!-- Precision Digital Micrometer Frame -->
  <path d="M -110 -20 C -150 -20, -150 70, -70 70 L 20 70 C 50 70, 50 20, 20 20" fill="none" stroke="url(#metalGrad)" stroke-width="18" stroke-linecap="round"/>
  <!-- Measuring Anvil & Spindle -->
  <rect x="-112" y="-30" width="14" height="20" fill="#cbd5e1" stroke="#334155"/>
  <rect x="-60" y="-30" width="90" height="14" fill="#cbd5e1" stroke="#334155"/>
  <!-- Micrometer Thimble & Ratchet Stop -->
  <rect x="30" y="-36" width="70" height="26" rx="3" fill="#1e2430" stroke="#f8fafc" stroke-width="1.5"/>
  <rect x="100" y="-32" width="30" height="18" rx="2" fill="#475569" stroke="#94a3b8"/>
  <!-- Precision Vernier Scale Markings -->
  <line x1="45" y1="-23" x2="85" y2="-23" stroke="#f8fafc" stroke-width="1"/>
  <line x1="50" y1="-28" x2="50" y2="-18" stroke="#f8fafc" stroke-width="1"/>
  <line x1="60" y1="-28" x2="60" y2="-18" stroke="#f8fafc" stroke-width="1"/>
  <line x1="70" y1="-28" x2="70" y2="-18" stroke="#f8fafc" stroke-width="1"/>
  <line x1="80" y1="-28" x2="80" y2="-18" stroke="#f8fafc" stroke-width="1"/>
  <text x="-40" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#f8fafc">0.001mm TOLERANCE</text>
</g>

  </g>

  <!-- Lower Schematic Label Plate -->
  <rect x="24" y="380" width="552" height="46" rx="6" fill="#141418" stroke="#334155" stroke-width="1.2" opacity="0.9"/>
  <text x="42" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">
    INDUSTRIAL TOOLS & MACHINERY
  </text>
  <text x="42" y="416" font-family="monospace" font-size="9" fill="#94a3b8" letter-spacing="0.5">
    SEC: CNC FABRICATION / METROLOGY • SPECIFICATION SCHEMATIC • REV 2.4
  </text>
  <text x="560" y="408" text-anchor="end" font-family="monospace" font-size="10" font-weight="bold" fill="#64748b">
    ISO 9001 / GOV VERIFIED
  </text>
</svg>