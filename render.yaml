databases:
  - name: tenderbid-db
    databaseName: tender_platform
    user: tender_user
    plan: free
    region: oregon

services:
  # FastAPI Backend Service
  - type: web
    name: tenderbid-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: "TenderBid AI API"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tenderbid-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./data/chroma"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: INGESTION_ENABLED
        value: "true"
      - key: DEADLINE_ALERT_ENABLED
        value: "true"

  # React + Vite Frontend Static Site
  - type: web
    name: tenderbid-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: tenderbid-backend
          property: host
